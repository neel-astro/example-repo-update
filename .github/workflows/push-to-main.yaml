name: Deploy (checkdeployaction)
on:
  push:
    branches: [dev, main]
    # tags:        
    #   - '*'
  # pull_request:
  #   types:
  #     - closed
  #   branches: [main]
  workflow_dispatch:

jobs:
  prod-astronomer:
    if: github.ref == 'refs/heads/main'
    env:
      ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |

          sudo apt-get install jq

          # we need to pre-install the CLI to set the context
          curl -sSL https://install.astronomer.io | sudo bash -s

      - name: Set CLI context
        run: astro context switch astronomer-dev.io

      - name: Print GITHUB_ACTIONS env var
        run: echo "GITHUB_ACTIONS=${GITHUB_ACTIONS}"
      # - name: DBT Deploy
      #   uses: astronomer/deploy-action@fix/tag-event-case
      #   with:
      #     action: deploy
      #     deploy-type: dbt
      #     deployment-name: neel-test-1
      #     root-folder: dbt/
      #     mount-path: /dbt
      #     workspace: ${{ secrets.WORKSPACE_ID }}
      #     checkout-submodules: true
      - name: Deploy DAGs/Image
        uses: astronomer/deploy-action@v0.9.0
        with:
          deployment-name: neel-test-1_DND
          deploy-type: image-and-dags
          deploy-image: true
          workspace: ${{ secrets.WORKSPACE_ID }}
      - name: Deploy DAGs/Image
        uses: astronomer/deploy-action@v0.9.0
        with:
          deployment-name: neel-test-2_DND
          deploy-type: image-and-dags
          deploy-image: true
          workspace: ${{ secrets.WORKSPACE_ID }}
      - name: Deploy DAGs/Image
        uses: astronomer/deploy-action@v0.9.0
        with:
          deployment-name: neel-test-3_DND
          deploy-type: image-and-dags
          deploy-image: true
          workspace: ${{ secrets.WORKSPACE_ID }}
      - name: Deploy DAGs/Image
        uses: astronomer/deploy-action@v0.9.0
        with:
          deployment-name: neel-test-4_DND
          deploy-type: image-and-dags
          deploy-image: true
          workspace: ${{ secrets.WORKSPACE_ID }}
      - name: Deploy DAGs/Image
        uses: astronomer/deploy-action@v0.9.0
        with:
          deployment-name: neel-test-5_DND
          deploy-type: image-and-dags
          deploy-image: true
          workspace: ${{ secrets.WORKSPACE_ID }}
      - name: Deploy DAGs/Image
        uses: astronomer/deploy-action@v0.9.0
        with:
          deployment-name: neel-test-6_DND
          deploy-type: image-and-dags
          deploy-image: true
          workspace: ${{ secrets.WORKSPACE_ID }}
